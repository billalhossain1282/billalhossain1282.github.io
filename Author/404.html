<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA redirect for /Author/ (case-insensitive)
      var path = window.location.pathname.replace(/^\/Author/i, '/Author');
      var search = window.location.search;
      var hash = window.location.hash;
      var newUrl = '/Author/' + (path.split('/Author/')[1] || '') + search + hash;
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
    <h1>Redirecting…</h1>
    <p>If you are not redirected, <a id="redirect-link" href="#">click here</a>.</p>
    <script>
      document.getElementById('redirect-link').href = newUrl;
    </script>
  </body>
</html>
